<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>
        Live Charater Counter
    </h2>
    <textarea id="message" oninput="countCharcters()" rows="5" cols="30"></textarea>

    <h3 id="result">Character : 0</h3>

    <script>
        function countCharcters(){
            let text = document.getElementById("message");

            let count = text.value.length;

            // Display charachter count
            document.getElementById("result").innerText = "Character :" + count;
        }
    </script>
</body>
</html>
