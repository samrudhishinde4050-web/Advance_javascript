<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
        function sum(num1, num2){
             document.write(num1 + num2, "<br>");
        }
        sum(10, 20);
     </script>


  <!-- // Use rest operstors -->
     <script>
        function add(...number){
            let sum = 0;
            for(let i in number){
                sum += number[i];
            }
            document.write(sum + "<br>");
        }
        
        add(12, 68, 78, 89);
        add(12, 34, 45, 33, 44, 77, 89, 100);
     </script>
</body>
</html>
