<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>fetch Data using ASYNC Await</h2>
    <button onclick="loadComments()"> Click to load</button>
    <p id="output"></p>

    <script>
        async function loadComments(){
            try{
                document.getElementById("output").textContent = "Loading Post..."

                const response = await fetch("https://jsonplaceholder.typicode.com/users");

                if(!response.ok){
                    throw new Error("File not found...");
                }

                const data = await response.json();

                let result = "Data Loaded Successfully: \n\n";

                data.forEach((comments) => {
                    result += `ID: ${comments.id}\n Name : ${comments.name}\n Eamil : ${comments.email}\n\n`;
                });

                document.getElementById("output").textContent = result;
            }
            catch(error){
                document.getElementById("output").textContent = "Error" + error.message;
            }
        } 
    </script>
</body>
</html>
