<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var name = "Samrudhi";
        var address = "Pune";
        var phone = "5647696222";
        //noramal string concatation
        document.write("My name is " + name + "I am from " + address + "contact me " + phone + "<br>");
    
    //document.write(`  `);  -backtick
    //${name} - varible interpolation
    // I am from ${address} - template literal interpolation
    //${name} - String interpolation
    
        //Template String or literal
    document.write(`My name is ${name}, I am from ${address},contact me ${phone}`);
    
    //Defination
    // Template literals are string written using backticks (``) that allow us to easily insert varibles or expression using ${}
    </script>
    
</body>
</html>
