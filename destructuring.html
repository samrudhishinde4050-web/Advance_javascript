<body>
    <script>
        // object Destructuring - old way
        const person = {
            name: "Vamini",
            age: 20,
            gender: "Female",
        };

        document.write("Name :" +
            person.name + 
            " Age : " +
            person.age +
            " Gender :" +
            person.gender,
        );

        let name1 = person.name;
        let age1 = person.age;
        let gender1 = person.gender;

        console.log(name1);
        console.log(age1);
        console.log(gender1);
    </script>

    <script>
        // object Destructuring - New ES6 way
        const person1 ={
            name: "Vrunda",
            age: 22,
            gender: "Female",
        };

        const {name, age, gender} = person1;
        console.log(name);
        console.log(age);
        console.log(gender);
        document.write(
            "Name :" + name + "Age :" + age + "Gender:" + gender,
        );
    </script>
    <script>

    //Destructring in function parameterss
    function showInfo({name, age, city}) {
        document.write(`Name : ${name}, Age : ${age}, City: ${city}`);

    }
    const person2 = {name : "Rajani", age :"22", city :"Pune"};
    showInfo(person2);
    </script>
