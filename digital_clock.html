<body>
    <h1 id="clock"></h1>
    <script>
        function showtime(){
            let now = new Date();

            let time = new Date()
            document.getElementById("clock").textContent = time.toLocaleTimeString();
        }
        showtime();
        setInterval(showtime, 1000);
    </script>
